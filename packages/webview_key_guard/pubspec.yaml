name: webview_key_guard
description: Optional macOS WebView keyboard redispatch protection for Flutter hosts.
version: 0.1.0
repository: https://github.com/DimitriSky/flutter_webview_key_guard
publish_to: none

environment:
  sdk: ^3.11.4
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: WebViewKeyGuardPlugin
